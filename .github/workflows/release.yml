name: Prepare installer release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag on the default branch (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installer-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      checksum: ${{ steps.checksum.outputs.sha256 }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require a stable tag and the default workflow branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Choose an existing stable tag such as v1.0.0.' >&2; exit 1;
          }
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo 'Run this workflow from the default branch.' >&2; exit 1;
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tag and check out its exact commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD || {
            echo 'The tag must belong to the default branch history.' >&2; exit 1;
          }
          git checkout --detach "$commit"
          printf 'commit=%s\ntag=%s\n' "$commit" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Validate, build and test the selected version
        run: bash scripts/validate-installer.sh
      - name: Make room for Docker on the disposable GitHub runner
        run: |
          # These preinstalled SDKs are unused by this project. Do not weaken
          # the installer's 20 GiB free-space requirement for CI.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /var/lib/docker
      - name: Install and rerun the exact release artifact with real Docker
        run: python3 scripts/smoke-installer.py --installer dist/install.sh
      - name: Record the tested installer checksum
        id: checksum
        working-directory: dist
        run: |
          sha256sum --check install.sh.sha256
          printf 'sha256=%s\n' "$(sha256sum install.sh | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Transfer only the tested release files
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer
          path: |
            dist/install.sh
            dist/install.sh.sha256
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No repository code executes in the job holding release-write access.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.test.outputs.artifact }}
          merge-multiple: true
          path: dist
      - name: Verify the transferred files
        working-directory: dist
        env:
          EXPECTED_SHA256: ${{ needs.test.outputs.checksum }}
        run: |
          sha256sum --check install.sh.sha256
          printf '%s  install.sh\n' "$EXPECTED_SHA256" | sha256sum --check -
      - name: Verify the tag still identifies the tested commit and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object | [.type, .sha] | @tsv')"
          read -r kind commit <<< "$object"
          for ((depth=0; depth<10; depth++)); do
            [[ "$kind" == tag ]] || break
            object="$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '.object | [.type, .sha] | @tsv')"
            read -r kind commit <<< "$object"
          done
          [[ "$kind" == commit && "$commit" == "$RELEASE_COMMIT" ]] || {
            echo 'The release tag changed after testing; rerun the workflow.' >&2; exit 1;
          }
          printf 'Installer built from commit `%s`.\n\nValidated with the installer test suite and a fresh Docker installation followed by a rerun. All six services passed their healthchecks and the login endpoint returned HTTP 200.\n\nDownload `install.sh` and `install.sh.sha256`, then verify with `sha256sum --check install.sh.sha256`.\n' \
            "$RELEASE_COMMIT" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/install.sh dist/install.sh.sha256 \
            --verify-tag --draft --title "Basicrum community $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
